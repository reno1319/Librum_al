name: Supabase Migration History Repair (one-off)

# LIBRUM 2.0 -- DB-MIG-BASELINE PART 5
#
# Temporary, manual-only workflow. Marks migrations 002-038 as APPLIED in
# the Supabase remote migration ledger WITHOUT executing any of their SQL
# bodies. Production schema has already been audited (see this repository's
# DB-MIG-BASELINE PART 1 / PART 2B reports) and already reflects migrations
# 002-038 -- only the remote ledger itself is empty (confirmed live via the
# PART 4A/4B read-only diagnostic workflows, now removed). Migration 039 is
# deliberately excluded here and must remain pending; there is no
# migration 001.
#
# This workflow's only mutating Supabase call, anywhere, is the single
# `supabase migration repair --linked --status applied 002 ... 038`
# invocation in the "Repair" step. It never runs `supabase db push`,
# `supabase migration up`, `supabase db pull`, `supabase db reset`, never
# applies 039, and never executes raw SQL -- it only rewrites remote
# migration history bookkeeping.
#
# Verification is structured JSON, read from the real, diagnostic-confirmed
# shape of `supabase migration list --linked --output-format json`:
#   { "migrations": [ { "local": "002", "remote": "", "time": "002" }, ... ],
#     "message": "Migrations listed" }
# `supabase migration list --linked` (human-readable) is also run once at
# the end purely for an operator-readable log entry; it gates nothing --
# every pass/fail decision in this workflow is made from the parsed JSON.
#
# Intended to be run once, by hand, via workflow_dispatch, then deleted
# from the repository.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair-migration-history:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_ID: pwkukotgpsegieshulpj
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Supabase CLI (pinned to the diagnostic-verified version)
        uses: supabase/setup-cli@v1
        with:
          version: 2.116.0

      - name: Verify jq availability
        run: |
          set -euo pipefail
          if ! command -v jq >/dev/null 2>&1; then
            echo "jq not found on this runner -- installing via apt (ubuntu-latest normally ships jq preinstalled)."
            sudo apt-get update -y
            sudo apt-get install -y jq
          fi
          jq --version

      - name: Initialize and link Supabase project (ephemeral, not committed)
        run: |
          set -euo pipefail

          if [ ! -f supabase/config.toml ]; then
            echo "No supabase/config.toml found -- running supabase init to create ephemeral runner-local project state (this state is never committed)."
            printf '\n' | supabase init --workdir .
          else
            echo "supabase/config.toml already present -- skipping init."
          fi

          supabase link \
            --project-ref "$PROJECT_ID" \
            --password "$SUPABASE_DB_PASSWORD"

      - name: Local migration-file safety gate
        run: |
          set -euo pipefail

          echo "Verifying local migration file contract before any remote mutation..."

          count_matches() {
            ls supabase/migrations/"${1}"_*.sql 2>/dev/null | wc -l | tr -d ' '
          }

          if [ "$(count_matches 001)" -ne 0 ]; then
            echo "SAFETY GATE FAILED: a migration 001 file exists. This repository is known to have no 001 -- refusing to proceed." >&2
            exit 1
          fi

          failed=0
          for v in $(seq -f "%03g" 2 38); do
            n="$(count_matches "$v")"
            if [ "$n" -ne 1 ]; then
              echo "SAFETY GATE FAILED: expected exactly one migration file for version ${v}, found ${n}." >&2
              failed=1
            fi
          done

          n039="$(count_matches 039)"
          if [ "$n039" -ne 1 ]; then
            echo "SAFETY GATE FAILED: expected exactly one migration file for version 039, found ${n039}." >&2
            failed=1
          fi

          # Anything numbered beyond 039 means the repository has advanced
          # past the baseline this workflow was reviewed against. Decimal-
          # safe parsing (10#$ver) avoids a zero-padded prefix like "008"
          # being misread as an invalid octal literal.
          for f in supabase/migrations/*.sql; do
            base="$(basename "$f")"
            if [[ "$base" =~ ^([0-9]{3})_ ]]; then
              ver="${BASH_REMATCH[1]}"
              ver_num=$((10#$ver))
              if [ "$ver_num" -gt 39 ]; then
                echo "SAFETY GATE FAILED: unexpected migration version ${ver} (${base}) found beyond the reviewed 002-039 baseline." >&2
                failed=1
              fi
            fi
          done

          if [ "$failed" -ne 0 ]; then
            echo "Local safety gate failed -- refusing to repair. See errors above." >&2
            exit 1
          fi

          echo "Local safety gate passed: 001 absent, 002-038 each present exactly once, 039 present exactly once, nothing beyond 039."

      - name: Structured pre-state read (stdout only, JSON)
        run: |
          set -euo pipefail

          # Deliberately NOT using 2>&1 here: the CLI can print status text
          # (e.g. "Connecting to remote database...") to stderr, which must
          # never be mixed into the file being parsed as JSON. stderr still
          # flows to the normal Actions log on its own, unredirected.
          supabase migration list --linked --output-format json > "$RUNNER_TEMP/pre.json"

          if ! jq empty "$RUNNER_TEMP/pre.json" >/dev/null 2>&1; then
            echo "PRE-STATE READ FAILED: 'supabase migration list --linked --output-format json' did not return valid JSON on stdout." >&2
            exit 1
          fi

          if ! jq -e 'type == "object"' "$RUNNER_TEMP/pre.json" >/dev/null; then
            echo "PRE-STATE READ FAILED: expected top-level JSON object." >&2
            exit 1
          fi

          if ! jq -e 'has("migrations")' "$RUNNER_TEMP/pre.json" >/dev/null; then
            echo "PRE-STATE READ FAILED: expected top-level \"migrations\" key." >&2
            exit 1
          fi

          if ! jq -e '.migrations | type == "array"' "$RUNNER_TEMP/pre.json" >/dev/null; then
            echo "PRE-STATE READ FAILED: \"migrations\" is not an array." >&2
            exit 1
          fi

          if ! jq -e '[.migrations[] | (has("local") and has("remote") and has("time"))] | all' "$RUNNER_TEMP/pre.json" >/dev/null; then
            echo "PRE-STATE READ FAILED: one or more migration entries are missing \"local\"/\"remote\"/\"time\"." >&2
            exit 1
          fi

          echo "Pre-state structured read valid: JSON object with a \"migrations\" array, every entry has local/remote/time."

      - name: Pre-repair hard gate -- local set exact, remote must be empty
        run: |
          set -euo pipefail

          expected_local="$(seq -f "%03g" 2 39)"

          actual_local="$(jq -r '.migrations[].local' "$RUNNER_TEMP/pre.json" | sort)"

          if [ "$actual_local" != "$(printf '%s\n' $expected_local | sort)" ]; then
            echo "PRE-REPAIR GATE FAILED: local migration versions reported by the CLI are not exactly 002-039." >&2
            echo "Expected:" >&2
            printf '%s\n' $expected_local >&2
            echo "Actual:" >&2
            printf '%s\n' "$actual_local" >&2
            exit 1
          fi

          non_empty_remote="$(jq -r '.migrations[] | select(.remote != "") | "local=\(.local) remote=\(.remote)"' "$RUNNER_TEMP/pre.json")"

          if [ -n "$non_empty_remote" ]; then
            echo "PRE-REPAIR GATE FAILED: Remote migration history is not empty. Refusing repair because the reviewed baseline assumption has changed." >&2
            echo "Affected rows (local/remote only):" >&2
            printf '%s\n' "$non_empty_remote" >&2
            exit 1
          fi

          echo "Pre-repair gate passed: local versions are exactly 002-039, and every remote value is empty."

      - name: Repair migration history for 002-038 (history only, no SQL execution)
        run: |
          set -euo pipefail

          echo "Repairing migration history: marking 002-038 as applied (history only, no SQL body executed)..."

          supabase migration repair \
            --linked \
            --status applied \
            002 003 004 005 006 007 008 009 010 \
            011 012 013 014 015 016 017 018 019 020 \
            021 022 023 024 025 026 027 028 029 030 \
            031 032 033 034 035 036 037 038

          echo "Repair command complete. Migration 039 was never referenced above and remains untouched."

      - name: Structured post-state read (stdout only, JSON)
        run: |
          set -euo pipefail

          # Same stdout-only discipline as the pre-state read above.
          supabase migration list --linked --output-format json > "$RUNNER_TEMP/post.json"

          if ! jq empty "$RUNNER_TEMP/post.json" >/dev/null 2>&1; then
            echo "POST-STATE READ FAILED: 'supabase migration list --linked --output-format json' did not return valid JSON on stdout." >&2
            exit 1
          fi

          if ! jq -e 'type == "object"' "$RUNNER_TEMP/post.json" >/dev/null; then
            echo "POST-STATE READ FAILED: expected top-level JSON object." >&2
            exit 1
          fi

          if ! jq -e 'has("migrations")' "$RUNNER_TEMP/post.json" >/dev/null; then
            echo "POST-STATE READ FAILED: expected top-level \"migrations\" key." >&2
            exit 1
          fi

          if ! jq -e '.migrations | type == "array"' "$RUNNER_TEMP/post.json" >/dev/null; then
            echo "POST-STATE READ FAILED: \"migrations\" is not an array." >&2
            exit 1
          fi

          if ! jq -e '[.migrations[] | (has("local") and has("remote") and has("time"))] | all' "$RUNNER_TEMP/post.json" >/dev/null; then
            echo "POST-STATE READ FAILED: one or more migration entries are missing \"local\"/\"remote\"/\"time\"." >&2
            exit 1
          fi

          echo "Post-state structured read valid: JSON object with a \"migrations\" array, every entry has local/remote/time."

      - name: Post-repair exact-set verification
        run: |
          set -euo pipefail

          expected_local="$(seq -f "%03g" 2 39)"
          actual_local="$(jq -r '.migrations[].local' "$RUNNER_TEMP/post.json" | sort)"

          if [ "$actual_local" != "$(printf '%s\n' $expected_local | sort)" ]; then
            echo "POST-REPAIR VERIFICATION FAILED: local migration versions reported by the CLI are not exactly 002-039." >&2
            echo "Expected:" >&2
            printf '%s\n' $expected_local >&2
            echo "Actual:" >&2
            printf '%s\n' "$actual_local" >&2
            exit 1
          fi

          expected_remote="002 003 004 005 006 007 008 009 010 011 012 013 014 015 016 017 018 019 020 021 022 023 024 025 026 027 028 029 030 031 032 033 034 035 036 037 038"
          expected_remote_sorted="$(printf '%s\n' $expected_remote | sort)"

          actual_remote_sorted="$(jq -r '.migrations[] | select(.remote != "") | .remote' "$RUNNER_TEMP/post.json" | sort)"

          if [ "$actual_remote_sorted" != "$expected_remote_sorted" ]; then
            echo "POST-REPAIR VERIFICATION FAILED: remote migration history is not exactly the expected 002-038 set." >&2
            echo "Expected remote versions (sorted):" >&2
            printf '%s\n' "$expected_remote_sorted" >&2
            echo "Actual remote versions (sorted):" >&2
            printf '%s\n' "$actual_remote_sorted" >&2
            exit 1
          fi

          echo "Post-repair exact-set verification passed: remote versions are exactly 002-038."

      - name: 039 explicit assertion -- must remain pending
        run: |
          set -euo pipefail

          row_039="$(jq -c '.migrations[] | select(.local == "039")' "$RUNNER_TEMP/post.json")"

          if [ -z "$row_039" ]; then
            echo "039 ASSERTION FAILED: no migration row with local == \"039\" was found in the post-repair list. Stop and investigate manually." >&2
            exit 1
          fi

          remote_039="$(printf '%s' "$row_039" | jq -r '.remote')"

          if [ "$remote_039" != "" ]; then
            echo "Migration 039 was unexpectedly marked applied. Stop and investigate manually." >&2
            exit 1
          fi

          echo "039 assertion passed: local \"039\" row exists and remote is empty (pending, as required)."

      - name: Human-readable final list (informational only)
        run: |
          set -euo pipefail
          echo "---- supabase migration list --linked (informational only, not a gate) ----"
          supabase migration list --linked

      - name: Final status
        run: |
          set -euo pipefail
          echo "Migration history repair verified: remote versions are exactly 002-038. Migration 039 remains pending and was not applied."
